name: Spatial law gate

# The gate measures the layout of the built site and compares it with a
# recorded baseline. It runs the VENDORED instrument — the point of a gate is
# that nobody can quietly soften it.
#
# ONE PLACE WHERE THE VENDORED COPY NOW DIFFERS FROM UPSTREAM, and it is
# recorded here rather than left to be discovered: the gate used to spawn
# Chrome by hand and hand it the harness URL on the command line. On this
# machine that browser took the URL and never navigated to it — the renderer
# stayed on about:blank, the harness never ran, no route ever completed, and
# the gate printed nothing at all: no finding, no error, no verdict. It was
# not a slow run; it was a run that could not begin, and it looked exactly
# like a run that was working. The gate now opens its measuring page through
# Playwright, and says when the page is open and when the sweep starts.
# Nothing else in the instrument was touched — no threshold, no tolerance,
# no rule, and no finding's meaning. The fix belongs upstream too.
#
# The site is a single-page app, so the gate cannot load it and wait: an
# iframe fires `load` before React has painted, and the instrument would
# settle on an empty document and report zero findings. The snapshot step
# renders each view in a real browser first and writes the result out as a
# static page, which is what the gate then measures.

on:
  # ONE RECEIPT PER PLATFORM.
  #
  # The gate compares the geometry it measures with a recorded receipt. A
  # receipt belongs to the platform it was measured on: the same page on two
  # platforms is two pages, because text metrics differ. The receipt kept in
  # design/spatial-baseline.json was measured on the machine the product is
  # composed on; this workflow runs on a hosted runner, and comparing the two
  # produced findings that were the platform and not the product — the history
  # view's first action "moved up 181px", and the matchmaker's key label had
  # become a hole the receipt recorded no numbers for.
  #
  # So the runner has its own receipt — design/spatial-baseline-ci.json —
  # measured on the runner, and the gate checks the runner against it. When
  # the product changes on purpose, the receipt is re-recorded with the
  # `record` input below, and the diff is read before it is committed.
  workflow_dispatch:
    inputs:
      record:
        description: 'Re-record the CI receipt on this runner instead of checking against it'
        type: boolean
        default: false

  push:
    branches: [main]
    paths:
      - 'otop/src/**'
      - 'otop/index.html'
      - 'otop/public/**'
      - 'scripts/**'
      - 'test/**'
      - 'design/spatial-baseline.json'
      - '.github/workflows/spatial.yml'
  pull_request:
    paths:
      - 'otop/src/**'
      - 'otop/index.html'
      - 'otop/public/**'
      - 'scripts/**'
      - 'test/**'
      - 'design/spatial-baseline.json'

jobs:
  gate:
    runs-on: ubuntu-latest
    # The gate alone takes twenty-four minutes on a hosted runner — it
    # measures 645 pages, each a FRESH load at its own width, on a real
    # clock — and the sweep and the falsifier follow it. A thirty-minute
    # job killed the gate at minute twenty-four and never reached the
    # falsifier, which is the part that proves the gate bites. The budget
    # is set for the work, not for the hope that it is faster today.
    timeout-minutes: 75

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install the browser the snapshot step drives
        run: npx playwright install --with-deps chromium

      - name: Build the site
        run: npx vite build --config vite.otop.config.js

      - name: Serve the build
        run: |
          npx vite preview --config vite.otop.config.js --port 8080 --strictPort &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/otop_index.json > /dev/null; then break; fi
            sleep 1
          done
          curl -sf http://localhost:8080/otop_index.json > /dev/null

      - name: Render every view to a static page
        # The snapshot also writes the built stylesheet where the instrument
        # looks for it, so the sweep measures every width the CSS changes at
        # — and not only the widths somebody remembered to list.
        run: node scripts/otop-snapshot.mjs http://localhost:8080 design/spatial-snapshots

      - name: Run the spatial gate
        if: ${{ !inputs.record }}
        run: node scripts/spatial/spatial-check.mjs --dir design/spatial-snapshots --baseline design/spatial-baseline-ci.json

      # Re-recording is a deliberate act with a diff to read, so it is a
      # separate, explicitly asked-for run — never something a push does.
      - name: Record the receipt on this runner
        if: ${{ inputs.record }}
        run: node scripts/spatial/spatial-check.mjs --dir design/spatial-snapshots --baseline design/spatial-baseline-ci.json --update

      # The receipt belongs with the run that measured it, whatever the run
      # concluded. A receipt that only exists on someone's laptop is a
      # receipt nobody can check.
      - name: Keep the receipt with the run
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spatial-receipt
          path: design/spatial-baseline-ci.json
          if-no-files-found: ignore

      # A view can build, deploy, return 200 and render nothing. Two did:
      # Champions tore its own tree down with a hook after a guard return,
      # and Matchmaker mapped a property of an envelope that was never
      # unwrapped. Neither showed up in a build, a status code or a unit
      # test — only in a browser. This loads every view and asserts the
      # tree actually painted.
      - name: Sweep every view in a real browser
        run: node scripts/otop-route-sweep.mjs http://localhost:8080

      # A gate that has never failed proves nothing. The falsifier injects
      # one real defect per mode into a copy of the site and checks the
      # gate catches every one — then checks the clean copy still passes,
      # so the gate is not simply always-failing.
      - name: Falsify the gate
        run: npm run spatial:check
