name: Air-DnD Telegram Scraper Pipeline

on:
  schedule:
    # Run every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allow manual trigger from the GitHub UI

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch full history so we can commit the state file back smoothly
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Telegram Scraper
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          # Increase timeout slightly since GitHub runners can occasionally be slow
          GEMINI_PARSE_TIMEOUT_MS: 15000 
          # Ensure Node has enough memory to process large strings over gramjs
          NODE_OPTIONS: "--max-old-space-size=1024"
        run: |
          npm run scrape:live

      - name: Refresh Public Snapshots
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run snapshot:refresh
          npm run feed:refresh

      - name: Commit Updated Scraper State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Only commit if the state file or snapshot actually changed
          if git status --porcelain | grep -qE ".sabai-scraper-state.json|public/data.json|public/feed.json"; then
            git add .sabai-scraper-state.json public/data.json public/feed.json
            git commit -m "chore(scraper): auto-update telegram message bounds and data snapshot"
            git push
          else
            echo "No new changes to commit."
          fi
