name: Air-DnD Telegram Scraper Pipeline

on:
  workflow_dispatch: # Manual trigger only — schedule disabled to avoid
                     # AUTH_KEY_DUPLICATED conflicts with the local daemon.

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so we can commit the state file back smoothly
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Telegram Scraper
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          # Increase timeout slightly since GitHub runners can occasionally be slow
          GEMINI_PARSE_TIMEOUT_MS: 15000 
          # Ensure Node has enough memory to process large strings over gramjs
          NODE_OPTIONS: "--max-old-space-size=1024"
        run: |
          npm run scrape:live

      - name: Refresh Public Snapshots
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          npm run snapshot:refresh
          npm run feed:refresh
          npm run photos:stage
          npm run verify:snapshot

      - name: Commit Updated Scraper State
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # The state file is gitignored, so a plain `git add` exits 1 and this
          # step failed on every run that got this far. Force-add it alongside
          # the snapshots; photos:stage has already force-added any photos.
          # `git status --porcelain` hides ignored files, so check the state
          # file explicitly.
          if git status --porcelain --ignored | grep -qE ".sabai-scraper-state.json|public/data.json|public/feed.json|public/funnel.json|public/images/"; then
            git add -f .sabai-scraper-state.json
            git add public/data.json public/feed.json public/feed_meta.json public/funnel.json
            git commit -m "chore(scraper): auto-update telegram message bounds and data snapshot"
            git push
          else
            echo "No new changes to commit."
          fi
